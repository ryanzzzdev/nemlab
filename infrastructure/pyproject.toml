[project]
name = "nemlab-infrastructure"
version = "0.1.0"
description = "NEMLab persistence and integrations: PostgreSQL stores, OE prices, queues"
requires-python = "==3.13.*"
dependencies = [
    "nemlab-core",
    "sqlalchemy>=2.0,<2.1.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemlab_infrastructure"]

[tool.uv.sources]
nemlab-core = { workspace = true }
