plugins { id 'java-library' }
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation project(':core')
    implementation 'org.springframework:spring-jdbc'
    implementation 'org.springframework:spring-context'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.postgresql:postgresql'
    implementation 'tools.jackson.core:jackson-databind'
    implementation 'org.slf4j:slf4j-api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    doFirst {
        systemProperty 'infrastructure.test.classpath', sourceSets.test.runtimeClasspath.asPath
    }
}
dependencyLocking { lockAllConfigurations() }
tasks.register('prices', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'au.nemlab.infrastructure.prices.PriceImportCommand'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

// Frozen parity fixtures for the Python rebuild; manual evidence run, not part of test.
tasks.register('parityExport', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'au.nemlab.infrastructure.parity.ParityExport'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    args rootProject.file('docs/project/evidence/python-rebuild/fixtures/parity-fixtures.json').absolutePath,
            rootProject.file('core/src/test/resources/prices').absolutePath
}

sourceSets.test.resources { srcDir rootProject.file('docs/project/evidence/oe-validation'); include 'historical-price-response.json' }
