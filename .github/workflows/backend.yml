name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25.0.4+7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: api/contracts/package-lock.json
      - name: Install locked contract tooling
        run: npm ci --ignore-scripts --prefix api/contracts
      - name: Build and test all modules
        run: ./gradlew clean build --no-daemon
      - name: Verify packaged application startup
        run: python3 scripts/smoke_apps.py
