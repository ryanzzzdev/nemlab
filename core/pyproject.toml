[project]
name = "nemlab-core"
version = "0.1.0"
description = "NEMLab battery domain core: market days, requests, dispatch, strategies"
requires-python = "==3.13.*"
dependencies = [
    "scipy>=1.15,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemlab_core"]
