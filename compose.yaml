services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: nemlab
      POSTGRES_USER: nemlab
      POSTGRES_PASSWORD: ${NEMLAB_DB_PASSWORD:?Set NEMLAB_DB_PASSWORD locally}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - nemlab-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nemlab -d nemlab"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  nemlab-postgres:
