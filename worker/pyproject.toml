[project]
name = "nemlab-worker"
version = "0.1.0"
description = "NEMLab non-HTTP worker: refresh queue polling, schedules, simulation runs"
requires-python = "==3.13.*"
dependencies = [
    "nemlab-core",
    "nemlab-infrastructure",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
]

[project.scripts]
nemlab-worker = "nemlab_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemlab_worker"]

[tool.uv.sources]
nemlab-core = { workspace = true }
nemlab-infrastructure = { workspace = true }
