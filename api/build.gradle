plugins {
    id 'java'
    id 'org.springframework.boot'
}
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation project(':core')
    implementation project(':infrastructure')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'org.springframework:spring-jdbc'
    implementation 'org.postgresql:postgresql'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
dependencyLocking { lockAllConfigurations() }

// Response captures are test outputs, so cached tests retain their contract evidence.
def contractCaptures = layout.buildDirectory.dir('contract-responses')
tasks.named('test') {
    outputs.dir(contractCaptures)
    systemProperty 'nemlab.contract.captures', contractCaptures.get().asFile.absolutePath
    doFirst {
        delete contractCaptures
    }
}

tasks.register('checkContract', Exec) {
    group = 'verification'
    description = 'Validate OpenAPI, generated types and actual HTTP test responses (run npm ci first).'
    dependsOn tasks.named('test')
    workingDir 'contracts'
    commandLine 'npm', 'run', 'check'
}

tasks.named('check') {
    dependsOn tasks.named('checkContract')
}
